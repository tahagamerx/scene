<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Scenexe Style Game</title>
<style>
body{margin:0;background:#000;overflow:hidden;color:#fff;font-family:sans-serif}
canvas{display:block}
#ui{position:absolute;top:10px;left:10px}
</style>
</head>
<body>

<div id="ui">
LEVEL: <span id="lvl">1</span> |
SCORE: <span id="score">0</span> |
HP: <span id="hp">100</span>
</div>

<canvas id="c"></canvas>

<script>
const c=document.getElementById("c");
const ctx=c.getContext("2d");

let W=innerWidth,H=innerHeight;
c.width=W;c.height=H;

let keys={},bullets=[],shapes=[],bots=[],portals=[];

let p={
 x:0,y:0,vx:0,vy:0,a:0,
 hp:100,maxHP:100,
 lvl:1,xp:0,next:100,score:0,
 reload:0
};

// controls
onkeydown=e=>keys[e.key]=1;
onkeyup=e=>keys[e.key]=0;
onmousemove=e=>p.a=Math.atan2(e.clientY-H/2,e.clientX-W/2);
onmousedown=()=>p.shoot=1;
onmouseup=()=>p.shoot=0;

// spawn
function spawnShape(){
 shapes.push({
  x:(Math.random()-0.5)*4000,
  y:(Math.random()-0.5)*4000,
  hp:50,
  size:20
 });
}
function spawnBot(){
 bots.push({
  x:(Math.random()-0.5)*3000,
  y:(Math.random()-0.5)*3000,
  hp:100,
  a:0,
  cd:0
 });
}

for(let i=0;i<120;i++)spawnShape();
for(let i=0;i<6;i++)spawnBot();
portals.push({x:1500,y:1500});

// update
function update(){

// movement
let sp=0.6;
if(keys["w"])p.vy-=sp;
if(keys["s"])p.vy+=sp;
if(keys["a"])p.vx-=sp;
if(keys["d"])p.vx+=sp;

p.vx*=0.9;p.vy*=0.9;
p.x+=p.vx;p.y+=p.vy;

// regen
if(p.hp<p.maxHP)p.hp+=0.05;

// shoot
if(p.shoot && p.reload<=0){
 bullets.push({x:p.x,y:p.y,a:p.a,life:80,dmg:20,own:"p"});
 p.reload=20;
}
if(p.reload>0)p.reload--;

// bullets
bullets.forEach((b,i)=>{
 b.x+=Math.cos(b.a)*12;
 b.y+=Math.sin(b.a)*12;

 // hit shapes
 shapes.forEach((s,si)=>{
  if(Math.hypot(b.x-s.x,b.y-s.y)<s.size){
   s.hp-=b.dmg;
   bullets.splice(i,1);
   if(s.hp<=0){
    p.score+=10;
    p.xp+=20;
    shapes.splice(si,1);
    spawnShape();
   }
  }
 });

 // hit player
 if(b.own==="bot"){
  if(Math.hypot(b.x-p.x,b.y-p.y)<20){
   p.hp-=5;
   bullets.splice(i,1);
  }
 }

 if(b.life--<=0)bullets.splice(i,1);
});

// level
if(p.xp>=p.next){
 p.lvl++;
 p.xp=0;
 p.next*=1.3;
}

// bots AI
bots.forEach(bot=>{
 let dx=p.x-bot.x;
 let dy=p.y-bot.y;
 bot.a=Math.atan2(dy,dx);

 bot.x+=Math.cos(bot.a)*1.2;
 bot.y+=Math.sin(bot.a)*1.2;

 if(bot.cd<=0){
  bullets.push({x:bot.x,y:bot.y,a:bot.a,life:80,dmg:10,own:"bot"});
  bot.cd=60;
 }
 bot.cd--;
});

// portal
portals.forEach(pt=>{
 if(Math.hypot(p.x-pt.x,p.y-pt.y)<80){
  p.x=(Math.random()-0.5)*3000;
  p.y=(Math.random()-0.5)*3000;
 }
});

// death
if(p.hp<=0){
 alert("You Died");
 location.reload();
}

// UI
lvl.innerText=p.lvl;
score.innerText=p.score;
hp.innerText=Math.floor(p.hp);
}

// draw
function draw(){
c.width=W;c.height=H;
ctx.fillStyle="#000";
ctx.fillRect(0,0,W,H);

ctx.save();
ctx.translate(W/2,H/2);
ctx.translate(-p.x,-p.y);

// grid
ctx.strokeStyle="#111";
for(let i=-2000;i<2000;i+=120){
 ctx.beginPath();ctx.moveTo(i,-2000);ctx.lineTo(i,2000);ctx.stroke();
 ctx.beginPath();ctx.moveTo(-2000,i);ctx.lineTo(2000,i);ctx.stroke();
}

// shapes
ctx.fillStyle="yellow";
shapes.forEach(s=>{
 ctx.beginPath();
 ctx.arc(s.x,s.y,s.size,0,7);
 ctx.fill();
});

// bots
ctx.fillStyle="red";
bots.forEach(b=>{
 ctx.beginPath();
 ctx.arc(b.x,b.y,22,0,7);
 ctx.fill();
});

// bullets
ctx.fillStyle="white";
bullets.forEach(b=>{
 ctx.beginPath();
 ctx.arc(b.x,b.y,5,0,7);
 ctx.fill();
});

// player
ctx.save();
ctx.translate(p.x,p.y);
ctx.rotate(p.a);

ctx.fillStyle="#444";
ctx.fillRect(0,-8,40,16);

ctx.beginPath();
ctx.arc(0,0,20,0,7);
ctx.fillStyle="#00adef";
ctx.fill();

ctx.restore();

ctx.restore();
}

// loop
function loop(){
update();
draw();
requestAnimationFrame(loop);
}
loop();

onresize=()=>{
W=innerWidth;
H=innerHeight;
};
</script>

</body>
</html>
