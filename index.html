<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Scenexe3 | Pro Edition</title>
    <style>
        body { margin: 0; overflow: hidden; background: #050505; font-family: 'Ubuntu', sans-serif; user-select: none; }
        canvas { display: block; }
        
        #menu-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle, rgba(15,15,15,0.9) 0%, #000 100%); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; }
        .menu-btn { background: transparent; color: #00adef; border: 1px solid #00adef; padding: 15px 60px; cursor: pointer; font-size: 20px; transition: 0.3s; text-transform: uppercase; letter-spacing: 3px; }
        .menu-btn:hover { background: #00adef; color: white; box-shadow: 0 0 30px #00adef; }

        #ui-container { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); width: 500px; pointer-events: none; }
        .xp-bar-bg { width: 100%; height: 8px; background: rgba(255,255,255,0.05); border: 1px solid #333; border-radius: 10px; overflow: hidden; }
        #xp-fill { width: 0%; height: 100%; background: #00adef; box-shadow: 0 0 15px #00adef; transition: width 0.3s; }
        
        .status-labels { position: absolute; top: 20px; right: 20px; color: white; font-family: monospace; text-align: right; font-size: 14px; }
        .active { color: #00adef; font-weight: bold; }
        #upgrade-pop { position: absolute; top: 20%; width: 100%; text-align: center; color: #ffe869; font-size: 30px; display: none; animation: pulse 1s infinite; }
        @keyframes pulse { 0% {transform: scale(1);} 50% {transform: scale(1.1);} 100% {transform: scale(1);} }
    </style>
</head>
<body>

    <div id="menu-overlay">
        <h1 style="color:white; font-size: 60px; letter-spacing: 10px;">SCENEXE<span style="color:#00adef">3</span></h1>
        <button class="menu-btn" onclick="startGame()">START MISSION</button>
        <p style="color: #444; margin-top: 20px;">[E] Auto-Fire | [V] Passive Mode | [WASD] Move</p>
    </div>

    <div id="upgrade-pop">TANK EVOLVED!</div>

    <div class="status-labels">
        AUTO-FIRE: <span id="autofire-label">OFF</span><br>
        PASSIVE MODE: <span id="passive-label">OFF</span>
    </div>

    <div id="ui-container">
        <div style="color:white; font-family: monospace; margin-bottom: 5px;">LVL <span id="lvl">1</span> | <span id="class-name">BASIC</span></div>
        <div class="xp-bar-bg"><div id="xp-fill"></div></div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let gameActive = false, currentFOV = 1, arenaSize = 5000;
        let keys = {}, bullets = [], shapes = [];
        
        let player = {
            x: 0, y: 0, vx: 0, vy: 0, angle: 0,
            lvl: 1, score: 0, xp: 0, nextLvl: 100,
            accel: 0.6, friction: 0.92, size: 25,
            color: '#00adef', barrels: 1, cooldown: 0,
            autoFire: false, passive: false
        };

        const SHAPES_DATA = [
            { sides: 3, color: '#ffe869', size: 20, hp: 20, xp: 20 },
            { sides: 4, color: '#ff8a8a', size: 22, hp: 40, xp: 40 },
            { sides: 5, color: '#768dfc', size: 45, hp: 150, xp: 150 },
            { sides: 11, color: '#1a1a1a', size: 200, hp: 7000, xp: 5000 },
            { sides: 3, color: '#222', size: 1400, hp: 200000, xp: 100000, isBoss: true }
        ];

        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resize); resize();

        function startGame() {
            document.getElementById('menu-overlay').style.display = 'none';
            gameActive = true;
            for(let i=0; i<300; i++) spawnShape();
            requestAnimationFrame(gameLoop);
        }

        function spawnShape() {
            let r = Math.random(), data = SHAPES_DATA[0];
            if(r > 0.99) data = SHAPES_DATA[4];
            else if(r > 0.96) data = SHAPES_DATA[3];
            else if(r > 0.85) data = SHAPES_DATA[2];
            else if(r > 0.6) data = SHAPES_DATA[1];
            shapes.push({
                x: (Math.random() - 0.5) * arenaSize * 1.8,
                y: (Math.random() - 0.5) * arenaSize * 1.8,
                angle: Math.random() * Math.PI, spin: 0.015, ...data, hp: data.hp
            });
        }

        window.addEventListener('keydown', e => {
            keys[e.key.toLowerCase()] = true;
            if(e.key.toLowerCase() === 'e') {
                player.autoFire = !player.autoFire;
                document.getElementById('autofire-label').innerText = player.autoFire ? "ON" : "OFF";
                document.getElementById('autofire-label').className = player.autoFire ? "active" : "";
            }
            if(e.key.toLowerCase() === 'v') {
                player.passive = !player.passive;
                document.getElementById('passive-label').innerText = player.passive ? "ON" : "OFF";
                document.getElementById('passive-label').className = player.passive ? "active" : "";
            }
        });
        window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);
        window.addEventListener('mousemove', e => player.angle = Math.atan2(e.clientY - canvas.height/2, e.clientX - canvas.width/2));

        function update() {
            if(!gameActive) return;

            // Neoxe Style Drift
            if(keys['w']) player.vy -= player.accel;
            if(keys['s']) player.vy += player.accel;
            if(keys['a']) player.vx -= player.accel;
            if(keys['d']) player.vx += player.accel;

            player.vx *= player.friction; player.vy *= player.friction;
            player.x += player.vx; player.y += player.vy;

            let targetFOV = 0.9 / (1 + (player.lvl * 0.008));
            currentFOV += (targetFOV - currentFOV) * 0.05;

            // Fire Logic (Passive check)
            if(!player.passive && (player.autoFire || window.isClicking) && player.cooldown <= 0) {
                for(let i=0; i<player.barrels; i++) {
                    let offset = (i - (player.barrels-1)/2) * 0.2;
                    bullets.push({ x: player.x, y: player.y, angle: player.angle + offset, life: 70 });
                }
                player.cooldown = 15;
            }
            if(player.cooldown > 0) player.cooldown--;

            bullets.forEach((b, bi) => {
                b.x += Math.cos(b.angle) * 16; b.y += Math.sin(b.angle) * 16;
                shapes.forEach((s, si) => {
                    if(Math.hypot(b.x - s.x, b.y - s.y) < s.size) {
                        s.hp -= 20; b.life = 0;
                        if(s.hp <= 0) {
                            player.score += s.xp; player.xp += s.xp;
                            shapes.splice(si, 1); spawnShape();
                            if(player.xp >= player.nextLvl) levelUp();
                        }
                    }
                });
                if(b.life-- <= 0) bullets.splice(bi, 1);
            });
            shapes.forEach(s => s.angle += s.spin);
        }

        function levelUp() {
            player.lvl++; player.xp = 0; player.nextLvl *= 1.4;
            document.getElementById('lvl').innerText = player.lvl;
            document.getElementById('xp-fill').style.width = "0%";
            
            if(player.lvl === 15) { player.barrels = 2; showEvolution("TWIN"); }
            if(player.lvl === 30) { player.barrels = 3; showEvolution("TRIPLE"); }
            if(player.lvl === 45) { player.barrels = 5; showEvolution("PENTA"); }
        }

        function showEvolution(name) {
            document.getElementById('class-name').innerText = name;
            let pop = document.getElementById('upgrade-pop');
            pop.style.display = 'block';
            setTimeout(() => pop.style.display = 'none', 3000);
        }

        function gameLoop() {
            if(!gameActive) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.save();
            ctx.translate(canvas.width/2, canvas.height/2);
            ctx.scale(currentFOV, currentFOV);
            ctx.translate(-player.x, -player.y);

            // Scenexe2 Grid
            ctx.strokeStyle = '#111'; ctx.lineWidth = 2;
            for(let i=-arenaSize; i<=arenaSize; i+=100) {
                ctx.beginPath(); ctx.moveTo(i, -arenaSize); ctx.lineTo(i, arenaSize); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(-arenaSize, i); ctx.lineTo(arenaSize, i); ctx.stroke();
            }

            shapes.forEach(s => {
                ctx.fillStyle = s.color; ctx.strokeStyle = '#000'; ctx.lineWidth = 6;
                ctx.beginPath();
                for(let i=0; i<s.sides; i++){
                    let a = s.angle + (i * Math.PI * 2)/s.sides;
                    ctx.lineTo(s.x + Math.cos(a)*s.size, s.y + Math.sin(a)*s.size);
                }
                ctx.closePath(); ctx.fill(); ctx.stroke();
            });

            ctx.fillStyle = player.color; ctx.strokeStyle = '#000'; ctx.lineWidth = 4;
            bullets.forEach(b => { ctx.beginPath(); ctx.arc(b.x, b.y, 10, 0, 7); ctx.fill(); ctx.stroke(); });

            // Player Tank
            ctx.save(); ctx.translate(player.x, player.y); ctx.rotate(player.angle);
            ctx.fillStyle = '#333'; ctx.strokeStyle = '#000'; ctx.lineWidth = 5;
            for(let i=0; i<player.barrels; i++) {
                ctx.save(); ctx.rotate((i - (player.barrels-1)/2) * 0.2);
                ctx.fillRect(0, -12, 50, 24); ctx.strokeRect(0, -12, 50, 24);
                ctx.restore();
            }
            ctx.fillStyle = player.color; ctx.beginPath(); ctx.arc(0, 0, player.size, 0, 7); ctx.fill(); ctx.stroke();
            ctx.restore();

            ctx.restore();
            update();
            document.getElementById('xp-fill').style.width = (player.xp/player.nextLvl*100) + "%";
            requestAnimationFrame(gameLoop);
        }
        window.onmousedown = () => window.isClicking = true;
        window.onmouseup = () => window.isClicking = false;
    </script>
</body>
</html>
