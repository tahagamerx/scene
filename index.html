<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Scenexe3 | The Complete Master Build</title>
    <style>
        body { margin: 0; overflow: hidden; background: #050505; font-family: 'Ubuntu', sans-serif; user-select: none; }
        canvas { display: block; }
        
        /* Intro Menu */
        #menu-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #050505; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; }
        .logo { color: white; font-size: 60px; letter-spacing: 15px; margin-bottom: 30px; }
        .logo span { color: #00adef; font-weight: 900; }
        .selector { display: flex; gap: 20px; margin-bottom: 20px; }
        .card { background: #111; border: 2px solid #333; padding: 15px; width: 140px; text-align: center; cursor: pointer; color: white; transition: 0.3s; border-radius: 5px; }
        .card:hover { border-color: #00adef; transform: translateY(-5px); }
        .active-card { border-color: #00adef; background: rgba(0, 173, 239, 0.1); }

        /* Skill Panels */
        .upgrade-panel { position: absolute; bottom: 20px; width: 220px; display: none; z-index: 10; }
        #left-panel { left: 20px; }
        #right-panel { right: 20px; }
        .skill-row { background: rgba(0, 0, 0, 0.85); border: 2px solid #333; color: white; margin: 5px 0; padding: 8px 15px; border-radius: 30px; display: flex; justify-content: space-between; align-items: center; font-size: 12px; cursor: pointer; }
        .skill-row:hover { border-color: #00adef; }
        .skill-count { color: #00adef; font-weight: bold; }

        /* UI */
        #ui-container { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); width: 400px; text-align: center; pointer-events: none; }
        .xp-bar-bg { width: 100%; height: 10px; background: #111; border: 1px solid #333; border-radius: 10px; overflow: hidden; }
        #xp-fill { width: 0%; height: 100%; background: #00adef; box-shadow: 0 0 10px #00adef; }
        #stats-info { color: white; font-family: monospace; margin-top: 8px; font-size: 13px; }
        #hud { position: absolute; top: 20px; right: 20px; color: #444; font-family: monospace; text-align: right; }
    </style>
</head>
<body>

    <div id="menu-overlay">
        <div class="logo">SCENEXE<span>3</span></div>
        <div class="selector" id="class-selector">
            <div class="card active-card" onclick="selectClass('Basic', this)">BASIC</div>
            <div class="card" onclick="selectClass('Sniper', this)">SNIPER</div>
        </div>
        <div class="selector" id="team-selector">
            <div class="card active-card" onclick="selectTeam('#00adef', this)">BLUE TEAM</div>
            <div class="card" onclick="selectTeam('#f44336', this)">RED TEAM</div>
        </div>
        <button style="background:transparent; color:#00adef; border:2px solid #00adef; padding:10px 40px; cursor:pointer;" onclick="startGame()">SPAWN</button>
    </div>

    <div id="hud">AUTO [E] | PASSIVE [V]</div>

    <div id="left-panel" class="upgrade-panel">
        <div class="skill-row" onclick="applyUpgrade('reload')"><span>[1] Reload</span><span id="reload-lvl" class="skill-count">0</span></div>
        <div class="skill-row" onclick="applyUpgrade('damage')"><span>[2] Damage</span><span id="damage-lvl" class="skill-count">0</span></div>
        <div class="skill-row" onclick="applyUpgrade('bSpeed')"><span>[3] B. Speed</span><span id="bSpeed-lvl" class="skill-count">0</span></div>
        <div class="skill-row" onclick="applyUpgrade('bHealth')"><span>[4] B. Health</span><span id="bHealth-lvl" class="skill-count">0</span></div>
    </div>

    <div id="right-panel" class="upgrade-panel">
        <div class="skill-row" onclick="applyUpgrade('maxHP')"><span id="maxHP-lvl" class="skill-count">0</span><span>Max HP [5]</span></div>
        <div class="skill-row" onclick="applyUpgrade('regeneration')"><span id="regeneration-lvl" class="skill-count">0</span><span>Regen [6]</span></div>
        <div class="skill-row" onclick="applyUpgrade('bodyDamage')"><span id="bodyDamage-lvl" class="skill-count">0</span><span>Body Dmg [7]</span></div>
        <div class="skill-row" onclick="applyUpgrade('mSpeed')"><span id="mSpeed-lvl" class="skill-count">0</span><span>Speed [8]</span></div>
    </div>

    <div id="ui-container">
        <div class="xp-bar-bg"><div id="xp-fill"></div></div>
        <div id="stats-info">LVL <span id="lvl">1</span> | POINTS: <span id="pts">0</span></div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let gameActive = false, currentFOV = 1, arenaSize = 6000;
        let keys = {}, bullets = [], shapes = [], portals = [];

        let player = {
            x: 0, y: 0, vx: 0, vy: 0, angle: 0, lvl: 1, xp: 0, nextLvl: 100, points: 0,
            stats: { reload:0, damage:0, bSpeed:0, bHealth:0, maxHP:0, regeneration:0, bodyDamage:0, mSpeed:0 },
            accel: 0.55, friction: 0.92, size: 25, color: '#00adef', 
            type: 'Basic', barrels: 1, cooldown: 0, autoFire: false, passive: false
        };

        function selectClass(c, el) { 
            player.type = c; 
            document.querySelectorAll('#class-selector .card').forEach(x => x.classList.remove('active-card'));
            el.classList.add('active-card');
        }
        function selectTeam(t, el) { 
            player.color = t; 
            document.querySelectorAll('#team-selector .card').forEach(x => x.classList.remove('active-card'));
            el.classList.add('active-card');
        }

        function startGame() {
            document.getElementById('menu-overlay').style.display = 'none';
            document.querySelectorAll('.upgrade-panel').forEach(p => p.style.display = 'block');
            gameActive = true;
            for(let i=0; i<300; i++) spawnShape();
            portals.push({x: 1000, y: 1000, color: '#9c27b0'}, {x: -1000, y: -1000, color: '#4caf50'});
            requestAnimationFrame(gameLoop);
        }

        function spawnShape() {
            let r = Math.random();
            let s = (r > 0.95) ? 5 : (r > 0.7) ? 4 : 3;
            shapes.push({
                x: (Math.random()-0.5)*10000, y: (Math.random()-0.5)*10000,
                size: 20+Math.random()*20, sides: s, hp: s*30, xp: s*40,
                color: (s==5?'#768dfc':s==4?'#ff8a8a':'#ffe869'), angle: Math.random()*7, spin: 0.02
            });
        }

        window.addEventListener('keydown', e => {
            let k = e.key.toLowerCase(); keys[k] = true;
            if(k === 'e') player.autoFire = !player.autoFire;
            if(k === 'v') player.passive = !player.passive;
            const keyMap = {'1':'reload','2':'damage','3':'bSpeed','4':'bHealth','5':'maxHP','6':'regeneration','7':'bodyDamage','8':'mSpeed'};
            if(keyMap[k]) applyUpgrade(keyMap[k]);
        });
        window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);
        window.addEventListener('mousemove', e => player.angle = Math.atan2(e.clientY - canvas.height/2, e.clientX - canvas.width/2));

        function applyUpgrade(s) {
            if(player.points > 0 && player.stats[s] < 8) {
                player.stats[s]++; player.points--;
                document.getElementById(`${s}-lvl`).innerText = player.stats[s];
                document.getElementById('pts').innerText = player.points;
            }
        }

        function update() {
            if(!gameActive) return;
            let moveSpeed = player.accel + (player.stats.mSpeed * 0.05);
            if(keys['w']) player.vy -= moveSpeed; if(keys['s']) player.vy += moveSpeed;
            if(keys['a']) player.vx -= moveSpeed; if(keys['d']) player.vx += moveSpeed;
            player.vx *= player.friction; player.vy *= player.friction;
            player.x += player.vx; player.y += player.vy;

            // DYNAMIC FOV (Sniper starts far, everyone expands on level up)
            let baseFOV = (player.type === 'Sniper') ? 0.55 : 0.9;
            let targetFOV = baseFOV / (1 + (player.lvl * 0.01));
            currentFOV += (targetFOV - currentFOV) * 0.05;

            // FIRE
            let rate = (player.type==='Sniper'?35:18) - (player.stats.reload * 1.5);
            if(!player.passive && (player.autoFire || window.isClicking) && player.cooldown <= 0) {
                for(let i=0; i<player.barrels; i++) {
                    bullets.push({ x: player.x, y: player.y, angle: player.angle + (i-(player.barrels-1)/2)*0.2, life: 75+(player.stats.bHealth*5) });
                }
                player.cooldown = rate;
            }
            if(player.cooldown > 0) player.cooldown--;

            // PORTAL LOGIC
            portals.forEach(p => {
                if(Math.hypot(player.x - p.x, player.y - p.y) < 50) {
                    player.x = -player.x; player.y = -player.y; // Teleport effect
                }
            });

            bullets.forEach((b, bi) => {
                let s = (player.type==='Sniper'?22:16) + player.stats.bSpeed;
                b.x += Math.cos(b.angle)*s; b.y += Math.sin(b.angle)*s;
                shapes.forEach((sh, si) => {
                    if(Math.hypot(b.x-sh.x, b.y-sh.y) < sh.size) {
                        sh.hp -= (25 + player.stats.damage*10); b.life = 0;
                        if(sh.hp <= 0) {
                            player.xp += sh.xp; shapes.splice(si, 1); spawnShape();
                            if(player.xp >= player.nextLvl) {
                                player.lvl++; player.points++; player.xp = 0; player.nextLvl *= 1.3;
                                if(player.lvl === 15) player.barrels = 2;
                                if(player.lvl === 30) player.barrels = 3;
                                document.getElementById('lvl').innerText = player.lvl;
                                document.getElementById('pts').innerText = player.points;
                            }
                        }
                    }
                });
                if(b.life-- <= 0) bullets.splice(bi, 1);
            });
            shapes.forEach(s => s.angle += s.spin);
        }

        function gameLoop() {
            if(!gameActive) return;
            ctx.clearRect(0,0,canvas.width,canvas.height);
            ctx.save();
            ctx.translate(canvas.width/2, canvas.height/2); ctx.scale(currentFOV, currentFOV); ctx.translate(-player.x, -player.y);

            // GRID
            ctx.strokeStyle = '#111'; ctx.lineWidth = 2;
            for(let i=-arenaSize; i<=arenaSize; i+=100) {
                ctx.beginPath(); ctx.moveTo(i, -arenaSize); ctx.lineTo(i, arenaSize); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(-arenaSize, i); ctx.lineTo(arenaSize, i); ctx.stroke();
            }

            // PORTALS
            portals.forEach(p => {
                ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, 60, 0, 7); ctx.fill();
                ctx.strokeStyle = 'white'; ctx.lineWidth = 5; ctx.stroke();
            });

            shapes.forEach(s => {
                ctx.fillStyle = s.color; ctx.strokeStyle = '#000'; ctx.lineWidth = 6;
                ctx.beginPath(); for(let i=0; i<s.sides; i++) ctx.lineTo(s.x+Math.cos(s.angle+i*Math.PI*2/s.sides)*s.size, s.y+Math.sin(s.angle+i*Math.PI*2/s.sides)*s.size);
                ctx.closePath(); ctx.fill(); ctx.stroke();
            });

            ctx.fillStyle = player.color; ctx.strokeStyle = '#000'; ctx.lineWidth = 4;
            bullets.forEach(b => { ctx.beginPath(); ctx.arc(b.x, b.y, 10, 0, 7); ctx.fill(); ctx.stroke(); });

            ctx.save(); ctx.translate(player.x, player.y); ctx.rotate(player.angle);
            ctx.fillStyle = '#333'; ctx.strokeStyle = '#000'; ctx.lineWidth = 5;
            for(let i=0; i<player.barrels; i++) {
                ctx.save(); ctx.rotate((i-(player.barrels-1)/2)*0.2);
                ctx.fillRect(0, -12, (player.type==='Sniper'?75:50), 24); ctx.strokeRect(0, -12, (player.type==='Sniper'?75:50), 24);
                ctx.restore();
            }
            ctx.fillStyle = player.color; ctx.beginPath(); ctx.arc(0,0,player.size,0,7); ctx.fill(); ctx.stroke();
            ctx.restore();

            ctx.restore(); update();
            document.getElementById('xp-fill').style.width = (player.xp/player.nextLvl*100) + "%";
            window.innerWidth = window.innerWidth; // Smooth reset
            requestAnimationFrame(gameLoop);
        }
        window.onmousedown = () => window.isClicking = true;
        window.onmouseup = () => window.isClicking = false;
        window.addEventListener('resize', () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; });
    </script>
</body>
</html>
