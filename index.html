<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Tank Game Reborn</title>
<style>
body{margin:0;background:#000;overflow:hidden;color:#fff;font-family:sans-serif}
canvas{display:block}
#ui{position:absolute;top:10px;left:10px}
</style>
</head>
<body>

<div id="ui">
LEVEL: <span id="lvl">1</span> |
SCORE: <span id="score">0</span> |
HP: <span id="hp">100</span>
</div>

<canvas id="c"></canvas>

<script>
const c=document.getElementById("c");
const x=c.getContext("2d");

let W=innerWidth,H=innerHeight;
c.width=W;c.height=H;

let keys={},bullets=[],shapes=[],bots=[],portals=[];

let p={
x:0,y:0,vx:0,vy:0,a:0,
hp:100,max:100,
lvl:1,xp:0,next:100,score:0,
reload:0,type:"basic"
};

// controls
onkeydown=e=>keys[e.key]=1;
onkeyup=e=>keys[e.key]=0;
onmousemove=e=>p.a=Math.atan2(e.clientY-H/2,e.clientX-W/2);
onmousedown=()=>p.shoot=1;
onmouseup=()=>p.shoot=0;

// spawn
function shape(){
shapes.push({x:(Math.random()-0.5)*4000,y:(Math.random()-0.5)*4000,hp:50,s:20});
}
function bot(){
bots.push({x:(Math.random()-0.5)*3000,y:(Math.random()-0.5)*3000,hp:100,a:0,r:0});
}
for(let i=0;i<150;i++)shape();
for(let i=0;i<5;i++)bot();
portals.push({x:1000,y:1000});

// update
function upd(){

// move
let sp=0.5;
if(keys["w"])p.vy-=sp;
if(keys["s"])p.vy+=sp;
if(keys["a"])p.vx-=sp;
if(keys["d"])p.vx+=sp;
p.vx*=0.9;p.vy*=0.9;
p.x+=p.vx;p.y+=p.vy;

// regen
if(p.hp<p.max)p.hp+=0.05;

// shoot
if(p.shoot && p.reload<=0){
bullets.push({x:p.x,y:p.y,a:p.a,life:80,own:"p"});
p.reload=20;
}
if(p.reload>0)p.reload--;

// bullets
bullets.forEach((b,i)=>{
b.x+=Math.cos(b.a)*10;
b.y+=Math.sin(b.a)*10;

// hit shapes
shapes.forEach((s,si)=>{
if(Math.hypot(b.x-s.x,b.y-s.y)<s.s){
s.hp-=20;
bullets.splice(i,1);
if(s.hp<=0){
p.score+=10;
p.xp+=20;
shapes.splice(si,1);
shape();
}
}
});

// hit player
if(b.own==="bot"){
if(Math.hypot(b.x-p.x,b.y-p.y)<20){
p.hp-=5;
bullets.splice(i,1);
}
}

if(b.life--<0)bullets.splice(i,1);
});

// level
if(p.xp>=p.next){
p.lvl++;
p.xp=0;
p.next*=1.3;

// tank upgrade
if(p.lvl==10)p.type="sniper";
if(p.lvl==20)p.type="triple";
}

// bots
bots.forEach(b=>{
let dx=p.x-b.x,dy=p.y-b.y;
b.a=Math.atan2(dy,dx);
b.x+=Math.cos(b.a);
b.y+=Math.sin(b.a);

if(b.r<=0){
bullets.push({x:b.x,y:b.y,a:b.a,life:80,own:"bot"});
b.r=60;
}
b.r--;
});

// portal
portals.forEach(pt=>{
if(Math.hypot(p.x-pt.x,p.y-pt.y)<80){
p.x=(Math.random()-0.5)*3000;
p.y=(Math.random()-0.5)*3000;
}
});

// death
if(p.hp<=0){
alert("You died");
location.reload();
}

// UI
lvl.innerText=p.lvl;
score.innerText=p.score;
hp.innerText=Math.floor(p.hp);
}

// draw
function draw(){
c.width=W;c.height=H;
x.fillStyle="#000";x.fillRect(0,0,W,H);

x.save();
x.translate(W/2,H/2);
x.translate(-p.x,-p.y);

// grid
x.strokeStyle="#111";
for(let i=-2000;i<2000;i+=100){
x.beginPath();x.moveTo(i,-2000);x.lineTo(i,2000);x.stroke();
x.beginPath();x.moveTo(-2000,i);x.lineTo(2000,i);x.stroke();
}

// shapes
x.fillStyle="yellow";
shapes.forEach(s=>{
x.beginPath();
x.arc(s.x,s.y,s.s,0,7);
x.fill();
});

// bots
x.fillStyle="red";
bots.forEach(b=>{
x.beginPath();
x.arc(b.x,b.y,20,0,7);
x.fill();
});

// bullets
x.fillStyle="white";
bullets.forEach(b=>{
x.beginPath();
x.arc(b.x,b.y,5,0,7);
x.fill();
});

// player
x.save();
x.translate(p.x,p.y);
x.rotate(p.a);

x.fillStyle="#555";
x.fillRect(0,-8,40,16);

x.beginPath();
x.arc(0,0,20,0,7);
x.fillStyle="#0af";
x.fill();

x.restore();

x.restore();
}

// loop
function loop(){
upd();
draw();
requestAnimationFrame(loop);
}
loop();

onresize=()=>{
W=innerWidth;H=innerHeight;
};
</script>

</body>
</html>
