<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let shapes=[], bullets=[], bots=[], portals=[], keys={}, camScale=1;

// PLAYER
let p = {
 x:0,y:0,vx:0,vy:0,angle:0,
 lvl:1,xp:0,next:100,score:0,pts:0,
 hp:100,maxHP:100,
 stats:{reload:0,damage:0,bSpeed:0,bHealth:0,maxHP:0,regen:0,bodyDmg:0,speed:0},
 barrels:1,bWidth:28,bLen:55,type:'Mono',
 autoF:false,passive:false,autoS:false,cooldown:0
};

// BOT SYSTEM
function spawnBot(){
 bots.push({
  x:(Math.random()-0.5)*5000,
  y:(Math.random()-0.5)*5000,
  hp:100,
  angle:0,
  cooldown:0
 });
}

function init(){
 canvas.width=innerWidth;
 canvas.height=innerHeight;

 for(let i=0;i<250;i++) spawnShape();
 for(let i=0;i<5;i++) spawnBot();

 portals.push({x:2000,y:2000,c:'#9c27b0'});

 requestAnimationFrame(loop);
}

// SHAPES
function spawnShape(){
 let sides=[3,4,5][Math.floor(Math.random()*3)];
 shapes.push({
  x:(Math.random()-0.5)*8000,
  y:(Math.random()-0.5)*8000,
  size:25+sides*5,
  hp:sides*60,
  xp:sides*60,
  color:sides==3?'#ffe869':sides==4?'#ff8a8a':'#768dfc'
 });
}

// CONTROLS
onkeydown=e=>keys[e.key.toLowerCase()]=true;
onkeyup=e=>keys[e.key.toLowerCase()]=false;
onmousemove=e=>p.angle=Math.atan2(e.clientY-innerHeight/2,e.clientX-innerWidth/2);
onmousedown=()=>window.fire=true;
onmouseup=()=>window.fire=false;

// UPDATE
function update(){

 // MOVEMENT
 let acc=0.6+p.stats.speed*0.1;
 if(keys['w'])p.vy-=acc;
 if(keys['s'])p.vy+=acc;
 if(keys['a'])p.vx-=acc;
 if(keys['d'])p.vx+=acc;

 p.vx*=0.9; p.vy*=0.9;
 p.x+=p.vx; p.y+=p.vy;

 // REGEN
 if(p.hp < p.maxHP){
  p.hp += 0.02 + p.stats.regen*0.05;
 }

 // SHOOT
 if((window.fire || p.autoF) && p.cooldown<=0){
  bullets.push({
   x:p.x,y:p.y,angle:p.angle,
   life:80,dmg:20+p.stats.damage*10,owner:'player'
  });
  p.cooldown=25-p.stats.reload;
 }

 if(p.cooldown>0)p.cooldown--;

 // BULLETS
 bullets.forEach((b,i)=>{
  b.x+=Math.cos(b.angle)*15;
  b.y+=Math.sin(b.angle)*15;

  // HIT SHAPES
  shapes.forEach((s,si)=>{
   if(Math.hypot(b.x-s.x,b.y-s.y)<s.size){
    s.hp-=b.dmg;
    bullets.splice(i,1);
    if(s.hp<=0){
     p.score+=s.xp;
     p.xp+=s.xp;
     shapes.splice(si,1);
     spawnShape();
    }
   }
  });

  // HIT PLAYER
  if(b.owner==='bot'){
   if(Math.hypot(b.x-p.x,b.y-p.y)<26){
    p.hp-=10;
    bullets.splice(i,1);
   }
  }

  if(b.life--<=0)bullets.splice(i,1);
 });

 // LEVEL UP
 if(p.xp>=p.next){
  p.lvl++;
  p.pts++;
  p.xp=0;
  p.next*=1.3;
 }

 // BOTS AI
 bots.forEach(bot=>{
  let dx=p.x-bot.x;
  let dy=p.y-bot.y;
  bot.angle=Math.atan2(dy,dx);

  bot.x+=Math.cos(bot.angle)*1.5;
  bot.y+=Math.sin(bot.angle)*1.5;

  if(bot.cooldown<=0){
   bullets.push({
    x:bot.x,y:bot.y,angle:bot.angle,
    life:80,dmg:10,owner:'bot'
   });
   bot.cooldown=60;
  }
  bot.cooldown--;
 });

 // PORTAL TELEPORT
 portals.forEach(pt=>{
  if(Math.hypot(p.x-pt.x,p.y-pt.y)<100){
   p.x=(Math.random()-0.5)*6000;
   p.y=(Math.random()-0.5)*6000;
  }
 });

 // DEATH
 if(p.hp<=0){
  alert("You Died");
  location.reload();
 }

 // UI
 document.getElementById('xp-fill').style.width=(p.xp/p.next*100)+"%";
 document.getElementById('ui-level').innerText=p.lvl;
 document.getElementById('ui-score').innerText=Math.floor(p.score);
}

// DRAW
function loop(){
 update();

 canvas.width=innerWidth;
 canvas.height=innerHeight;

 ctx.clearRect(0,0,canvas.width,canvas.height);

 ctx.save();
 ctx.translate(canvas.width/2,canvas.height/2);
 ctx.scale(camScale,camScale);
 ctx.translate(-p.x,-p.y);

 // GRID
 ctx.strokeStyle='#111';
 for(let i=-4000;i<4000;i+=150){
  ctx.beginPath();ctx.moveTo(i,-4000);ctx.lineTo(i,4000);ctx.stroke();
  ctx.beginPath();ctx.moveTo(-4000,i);ctx.lineTo(4000,i);ctx.stroke();
 }

 // SHAPES
 shapes.forEach(s=>{
  ctx.fillStyle=s.color;
  ctx.beginPath();
  ctx.arc(s.x,s.y,s.size,0,7);
  ctx.fill();
 });

 // BOTS
 bots.forEach(b=>{
  ctx.fillStyle='red';
  ctx.beginPath();
  ctx.arc(b.x,b.y,25,0,7);
  ctx.fill();
 });

 // BULLETS
 ctx.fillStyle='white';
 bullets.forEach(b=>{
  ctx.beginPath();
  ctx.arc(b.x,b.y,6,0,7);
  ctx.fill();
 });

 // PLAYER
 ctx.save();
 ctx.translate(p.x,p.y);
 ctx.rotate(p.angle);

 ctx.fillStyle='#333';
 ctx.fillRect(0,-10,50,20);

 ctx.beginPath();
 ctx.arc(0,0,25,0,7);
 ctx.fillStyle='#00adef';
 ctx.fill();

 ctx.restore();

 ctx.restore();

 requestAnimationFrame(loop);
}

init();
</script>
