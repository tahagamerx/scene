<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Scenexe2.io | Final Master Build</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: white; user-select: none; }
        canvas { display: block; }
        
        /* Scenexe2 Style UI Panels */
        .panel { position: absolute; bottom: 20px; width: 230px; display: none; z-index: 100; }
        #left-panel { left: 20px; }
        #right-panel { right: 20px; }
        
        .stat-bar { background: rgba(10, 10, 10, 0.9); border: 1px solid #333; margin: 4px 0; padding: 6px 12px; border-radius: 4px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; transition: 0.2s; }
        .stat-bar:hover { border-color: #00adef; background: #111; }
        .stat-name { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: #aaa; }
        .stat-val { color: #00adef; font-weight: bold; font-family: monospace; }
        .key-hint { color: #444; font-size: 9px; margin-right: 5px; }

        /* XP & Leveling */
        #xp-wrapper { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); width: 450px; text-align: center; }
        .xp-container { width: 100%; height: 6px; background: #111; border: 1px solid #222; border-radius: 10px; overflow: hidden; position: relative; }
        #xp-bar { width: 0%; height: 100%; background: linear-gradient(90deg, #00adef, #005f7a); box-shadow: 0 0 10px rgba(0, 173, 239, 0.5); transition: 0.3s; }
        #lvl-info { margin-top: 8px; font-size: 12px; letter-spacing: 2px; font-family: monospace; color: #eee; }

        /* HUD Labels */
        #hud { position: absolute; top: 20px; left: 20px; font-family: monospace; color: #444; font-size: 11px; line-height: 1.6; }
        .active { color: #00adef !important; text-shadow: 0 0 5px #00adef; }
        
        /* Start Menu */
        #overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 1000; }
        .logo { font-size: 50px; letter-spacing: 15px; margin-bottom: 50px; font-weight: 100; }
        .logo b { color: #00adef; font-weight: 900; }
        .btn { border: 1px solid #00adef; color: #00adef; padding: 12px 50px; background: none; cursor: pointer; font-size: 14px; letter-spacing: 4px; transition: 0.4s; }
        .btn:hover { background: #00adef; color: white; box-shadow: 0 0 40px #00adef; }
    </style>
</head>
<body>

    <div id="overlay">
        <div class="logo">SCENEXE<b>2</b></div>
        <button class="btn" onclick="initGame()">SPAWN</button>
    </div>

    <div id="hud">
        DIMENSION: THE VOID<br>
        AUTO-FIRE [E]: <span id="h-e">OFF</span><br>
        PASSIVE [V]: <span id="h-v">OFF</span><br>
        AUTO-SPIN [C]: <span id="h-c">OFF</span>
    </div>

    <div id="left-panel" class="panel">
        <div class="stat-bar" onclick="upStat('reload')"><span><span class="key-hint">1</span><span class="stat-name">Reload</span></span><span class="stat-val" id="s-reload">0</span></div>
        <div class="stat-bar" onclick="upStat('damage')"><span><span class="key-hint">2</span><span class="stat-name">Damage</span></span><span class="stat-val" id="s-damage">0</span></div>
        <div class="stat-bar" onclick="upStat('bSpeed')"><span><span class="key-hint">3</span><span class="stat-name">B. Speed</span></span><span class="stat-val" id="s-bSpeed">0</span></div>
        <div class="stat-bar" onclick="upStat('bHealth')"><span><span class="key-hint">4</span><span class="stat-name">B. Health</span></span><span class="stat-val" id="s-bHealth">0</span></div>
    </div>

    <div id="right-panel" class="panel">
        <div class="stat-bar" onclick="upStat('maxHP')"><span class="stat-val" id="s-maxHP">0</span><span><span class="stat-name">Max Health</span><span class="key-hint">5</span></span></div>
        <div class="stat-bar" onclick="upStat('regen')"><span class="stat-val" id="s-regen">0</span><span><span class="stat-name">Regen</span><span class="key-hint">6</span></span></div>
        <div class="stat-bar" onclick="upStat('bodyDmg')"><span class="stat-val" id="s-bodyDmg">0</span><span><span class="stat-name">Body Dmg</span><span class="key-hint">7</span></span></div>
        <div class="stat-bar" onclick="upStat('speed')"><span class="stat-val" id="s-speed">0</span><span><span class="stat-name">Speed</span><span class="key-hint">8</span></span></div>
    </div>

    <div id="xp-wrapper">
        <div class="xp-container"><div id="xp-bar"></div></div>
        <div id="lvl-info">LEVEL <span id="ui-lvl">1</span> | <span id="ui-class">NODE</span> | POINTS: <span id="ui-pts">0</span></div>
    </div>

    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let gameOn = false, camZoom = 1, arena = 8000;
        let shapes = [], bullets = [], portals = [], keys = {};

        let p = {
            x: 0, y: 0, vx: 0, vy: 0, angle: 0, 
            lvl: 1, xp: 0, next: 100, pts: 0,
            stats: { reload:0, damage:0, bSpeed:0, bHealth:0, maxHP:0, regen:0, bodyDmg:0, speed:0 },
            barrels: 1, type: 'Node', color: '#00adef',
            autoF: false, passive: false, autoS: false,
            hp: 100, maxHP: 100, size: 24
        };

        function initGame() {
            document.getElementById('overlay').style.display = 'none';
            document.querySelectorAll('.panel').forEach(el => el.style.display = 'block');
            gameOn = true;
            for(let i=0; i<400; i++) spawnShape();
            portals.push({x: 1500, y: 1500, c: '#9c27b0', dim: 'Abyss'}, {x: -1500, y: -1500, c: '#4caf50', dim: 'Sanctuary'});
            requestAnimationFrame(loop);
        }

        function spawnShape() {
            let r = Math.random();
            let sides = (r > 0.98) ? 6 : (r > 0.9) ? 5 : (r > 0.7) ? 4 : 3;
            shapes.push({
                x: (Math.random()-0.5)*arena, y: (Math.random()-0.5)*arena,
                size: 20 + (sides * 5), sides: sides, 
                hp: sides * 40, xp: sides * 50,
                color: (sides==6?'#ff00ff':sides==5?'#768dfc':sides==4?'#ff8a8a':'#ffe869'),
                angle: Math.random()*7, spin: 0.015
            });
        }

        window.onkeydown = e => {
            let k = e.key.toLowerCase(); keys[k] = true;
            if(k === 'e') { p.autoF = !p.autoF; updateHUD(); }
            if(k === 'v') { p.passive = !p.passive; updateHUD(); }
            if(k === 'c') { p.autoS = !p.autoS; updateHUD(); }
            const m = {'1':'reload','2':'damage','3':'bSpeed','4':'bHealth','5':'maxHP','6':'regen','7':'bodyDmg','8':'speed'};
            if(m[k]) upStat(m[k]);
        };
        window.onkeyup = e => keys[e.key.toLowerCase()] = false;
        window.onmousemove = e => p.angle = Math.atan2(e.clientY - canvas.height/2, e.clientX - canvas.width/2);
        window.onmousedown = () => window.firing = true;
        window.onmouseup = () => window.firing = false;

        function updateHUD() {
            document.getElementById('h-e').className = p.autoF ? 'active' : ''; document.getElementById('h-e').innerText = p.autoF ? 'ON' : 'OFF';
            document.getElementById('h-v').className = p.passive ? 'active' : ''; document.getElementById('h-v').innerText = p.passive ? 'ON' : 'OFF';
            document.getElementById('h-c').className = p.autoS ? 'active' : ''; document.getElementById('h-c').innerText = p.autoS ? 'ON' : 'OFF';
        }

        function upStat(s) {
            if(p.pts > 0 && p.stats[s] < 15) {
                p.stats[s]++; p.pts--;
                document.getElementById(`s-${s}`).innerText = p.stats[s];
                document.getElementById('ui-pts').innerText = p.pts;
                if(s==='maxHP') { p.maxHP += 50; p.hp += 50; }
            }
        }

        function update() {
            if(!gameOn) return;
            let move = 0.6 + (p.stats.speed * 0.08);
            if(keys['w']) p.vy -= move; if(keys['s']) p.vy += move;
            if(keys['a']) p.vx -= move; if(keys['d']) p.vx += move;
            p.vx *= 0.92; p.vy *= 0.92; p.x += p.vx; p.y += p.vy;

            if(p.autoS) p.angle += 0.04;

            // FOV Expansion Logic
            let targetZoom = 0.8 / (1 + (p.lvl * 0.012));
            camZoom += (targetZoom - camZoom) * 0.05;

            // Combat
            let rate = 20 - (p.stats.reload * 1.1);
            if(!p.passive && (p.autoF || window.firing) && p.cooldown <= 0) {
                for(let i=0; i<p.barrels; i++) {
                    bullets.push({
                        x: p.x, y: p.y, 
                        angle: p.angle + (i-(p.barrels-1)/2)*0.2, 
                        life: 80 + (p.stats.bHealth*5)
                    });
                }
                p.cooldown = rate;
            }
            if(p.cooldown > 0) p.cooldown--;

            bullets.forEach((b, bi) => {
                let s = 16 + (p.stats.bSpeed * 1.5);
                b.x += Math.cos(b.angle)*s; b.y += Math.sin(b.angle)*s;
                shapes.forEach((sh, si) => {
                    if(Math.hypot(b.x-sh.x, b.y-sh.y) < sh.size) {
                        sh.hp -= (25 + p.stats.damage*12); b.life = 0;
                        if(sh.hp <= 0) {
                            p.xp += sh.xp; shapes.splice(si, 1); spawnShape();
                            if(p.xp >= p.next) {
                                p.lvl++; p.pts++; p.xp = 0; p.next *= 1.35;
                                if(p.lvl==15) { p.barrels=2; p.type="Twin"; }
                                if(p.lvl==30) { p.barrels=3; p.type="Triple"; }
                                if(p.lvl==45) { p.barrels=5; p.type="Penta"; }
                                document.getElementById('ui-lvl').innerText = p.lvl;
                                document.getElementById('ui-class').innerText = p.type.toUpperCase();
                                document.getElementById('ui-pts').innerText = p.pts;
                            }
                        }
                    }
                });
                if(b.life-- <= 0) bullets.splice(bi, 1);
            });
            shapes.forEach(s => s.angle += s.spin);
            
            // Portal Teleport
            portals.forEach(pt => {
                if(Math.hypot(p.x - pt.x, p.y - pt.y) < 60) {
                    p.x = -p.x * 0.8; p.y = -p.y * 0.8; // Dimension Leap
                }
            });

            document.getElementById('xp-bar').style.width = (p.xp/p.next*100) + "%";
        }

        function loop() {
            if(!gameOn) return;
            canvas.width = window.innerWidth; canvas.height = window.innerHeight;
            ctx.clearRect(0,0,canvas.width,canvas.height);
            ctx.save();
            ctx.translate(canvas.width/2, canvas.height/2); ctx.scale(camZoom, camZoom); ctx.translate(-p.x, -p.y);

            // Scenexe2 Grid
            ctx.strokeStyle = '#111'; ctx.lineWidth = 2;
            for(let i=-arena; i<=arena; i+=150) {
                ctx.beginPath(); ctx.moveTo(i, -arena); ctx.lineTo(i, arena); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(-arena, i); ctx.lineTo(arena, i); ctx.stroke();
            }

            // Portals (Wormholes)
            portals.forEach(pt => {
                ctx.shadowBlur = 20; ctx.shadowColor = pt.c;
                ctx.fillStyle = pt.c; ctx.beginPath(); ctx.arc(pt.x, pt.y, 70, 0, 7); ctx.fill();
                ctx.shadowBlur = 0;
            });

            // Entities
            shapes.forEach(s => {
                ctx.fillStyle = s.color; ctx.strokeStyle = '#000'; ctx.lineWidth = 6;
                ctx.beginPath(); for(let i=0; i<s.sides; i++) ctx.lineTo(s.x+Math.cos(s.angle+i*Math.PI*2/s.sides)*s.size, s.y+Math.sin(s.angle+i*Math.PI*2/s.sides)*s.size);
                ctx.closePath(); ctx.fill(); ctx.stroke();
            });

            // Bullets
            ctx.fillStyle = p.color; ctx.strokeStyle = '#000'; ctx.lineWidth = 4;
            bullets.forEach(b => { ctx.beginPath(); ctx.arc(b.x, b.y, 11, 0, 7); ctx.fill(); ctx.stroke(); });

            // Player Tank
            ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.angle);
            ctx.fillStyle = '#252525'; ctx.strokeStyle = '#000'; ctx.lineWidth = 5;
            for(let i=0; i<p.barrels; i++) {
                ctx.save(); ctx.rotate((i-(p.barrels-1)/2)*0.2);
                ctx.fillRect(0, -14, 55, 28); ctx.strokeRect(0, -14, 55, 28);
                ctx.restore();
            }
            ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(0,0,p.size,0,7); ctx.fill(); ctx.stroke();
            ctx.restore();

            ctx.restore(); update();
            requestAnimationFrame(loop);
        }
    </script>
</body>
</html>
