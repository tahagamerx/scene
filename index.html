<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Tank Arena Online (Offline Version)</title>
<style>
body{margin:0;overflow:hidden;background:#000;font-family:sans-serif}
canvas{display:block}
#ui{position:absolute;top:10px;left:10px;color:#fff;font-size:14px}
</style>
</head>
<body>

<div id="ui">
LEVEL: <span id="lvl">1</span> |
SCORE: <span id="score">0</span> |
HP: <span id="hp">100</span>
</div>

<canvas id="c"></canvas>

<script>
const c=document.getElementById("c");
const ctx=c.getContext("2d");

let W=innerWidth,H=innerHeight;
c.width=W;c.height=H;

let keys={},bullets=[],bots=[],shapes=[];

let p={
x:0,y:0,vx:0,vy:0,a:0,
hp:100,maxHP:100,
lvl:1,xp:0,next:100,score:0,
reload:0
};

// controls
onkeydown=e=>keys[e.key.toLowerCase()]=1;
onkeyup=e=>keys[e.key.toLowerCase()]=0;
onmousemove=e=>p.a=Math.atan2(e.clientY-H/2,e.clientX-W/2);
onmousedown=()=>p.shoot=1;
onmouseup=()=>p.shoot=0;

// spawn bots
function spawnBot(){
bots.push({
x:(Math.random()-0.5)*5000,
y:(Math.random()-0.5)*5000,
a:0,
cd:0,
hp:80
});
}

// spawn shapes
function spawnShape(){
shapes.push({
x:(Math.random()-0.5)*5000,
y:(Math.random()-0.5)*5000,
hp:50,
size:20
});
}

for(let i=0;i<8;i++)spawnBot();
for(let i=0;i<120;i++)spawnShape();

// update
function update(){

// movement
let acc=0.6;

if(keys["w"])p.vy-=acc;
if(keys["s"])p.vy+=acc;
if(keys["a"])p.vx-=acc;
if(keys["d"])p.vx+=acc;

p.vx*=0.88;
p.vy*=0.88;

p.x+=p.vx;
p.y+=p.vy;

// shooting
if(p.shoot && p.reload<=0){
bullets.push({
x:p.x,
y:p.y,
a:p.a,
life:90,
dmg:20,
owner:"p"
});
p.vx-=Math.cos(p.a)*0.3;
p.vy-=Math.sin(p.a)*0.3;
p.reload=18;
}
if(p.reload>0)p.reload--;

// bullets
bullets.forEach((b,i)=>{
b.x+=Math.cos(b.a)*12;
b.y+=Math.sin(b.a)*12;

// shape hit
shapes.forEach((s,si)=>{
if(Math.hypot(b.x-s.x,b.y-s.y)<s.size){
s.hp-=b.dmg;
bullets.splice(i,1);
if(s.hp<=0){
p.score+=10;
p.xp+=20;
shapes.splice(si,1);
spawnShape();
}
}
});

// player hit
if(b.owner==="bot"){
if(Math.hypot(b.x-p.x,b.y-p.y)<25){
p.hp-=6;
bullets.splice(i,1);
}
}

if(b.life--<=0)bullets.splice(i,1);
});

// level up
if(p.xp>=p.next){
p.lvl++;
p.xp=0;
p.next*=1.3;
}

// bots AI
bots.forEach(bot=>{
let dx=p.x-bot.x;
let dy=p.y-bot.y;

bot.a=Math.atan2(dy,dx);

bot.x+=Math.cos(bot.a)*1.2;
bot.y+=Math.sin(bot.a)*1.2;

if(bot.cd<=0){
bullets.push({
x:bot.x,
y:bot.y,
a:bot.a,
life:80,
dmg:10,
owner:"bot"
});
bot.cd=60;
}
bot.cd--;
});

// death
if(p.hp<=0){
alert("Game Over");
location.reload();
}

// UI
lvl.innerText=p.lvl;
score.innerText=p.score;
hp.innerText=Math.floor(p.hp);
}

// draw
function draw(){
c.width=W;c.height=H;

ctx.fillStyle="#000";
ctx.fillRect(0,0,W,H);

ctx.save();
ctx.translate(W/2,H/2);
ctx.translate(-p.x,-p.y);

// grid
ctx.strokeStyle="#111";
for(let i=-3000;i<3000;i+=120){
ctx.beginPath();ctx.moveTo(i,-3000);ctx.lineTo(i,3000);ctx.stroke();
ctx.beginPath();ctx.moveTo(-3000,i);ctx.lineTo(3000,i);ctx.stroke();
}

// shapes
ctx.fillStyle="#ffe869";
shapes.forEach(s=>{
ctx.beginPath();
ctx.arc(s.x,s.y,s.size,0,7);
ctx.fill();
});

// bots
ctx.fillStyle="#ff3b3b";
bots.forEach(b=>{
ctx.beginPath();
ctx.arc(b.x,b.y,24,0,7);
ctx.fill();
});

// bullets
ctx.fillStyle="#fff";
bullets.forEach(b=>{
ctx.beginPath();
ctx.arc(b.x,b.y,4,0,7);
ctx.fill();
});

// player tank
ctx.save();
ctx.translate(p.x,p.y);
ctx.rotate(p.a);

ctx.fillStyle="#444";
ctx.beginPath();
ctx.arc(0,0,26,0,7);
ctx.fill();

ctx.fillStyle="#00adef";
ctx.fillRect(0,-10,55,20);

ctx.fillStyle="#111";
ctx.fillRect(55,-5,10,10);

ctx.restore();

ctx.restore();
}

// loop
function loop(){
update();
draw();
requestAnimationFrame(loop);
}
loop();

onresize=()=>{
W=innerWidth;
H=innerHeight;
};
</script>

</body>
</html>
